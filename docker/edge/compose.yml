# The edge: the one Caddy on the server and the only container with a published port. It is a Compose
# project of its own, so a site change never touches an app's stack. Lives in /srv/edge with:
#   edge.env   the values the site files read as {$JAINAV_…}: the domain, staging's login
#   config/    Caddyfile, snippets.caddy, cloudflare-ranges.caddy and sites/<app>.caddy
#   certs/     <app>/origin.pem, origin-key.pem (Cloudflare Origin CA) and aop-ca.pem
# Directories are mounted, not single files: a file replaced by rename is seen on the next reload.
# See docs/runbooks/edge.md.
name: edge

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # Only 443: Cloudflare connects over HTTPS (SSL Full (strict)); the firewall admits only
    # Cloudflare's IP ranges (docs/runbooks/edge.md §4).
    ports:
      - '443:443/tcp'
    env_file: edge.env
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # Binding to 443 is all it needs from root; everything else is dropped.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    # Limits as in docker/compose.prod.yml. The kernel kills Caddy late: nothing is reachable
    # without it.
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 64m
    cpus: 1.0
    cpu_shares: 1024
    oom_score_adj: -800
    pids_limit: 256
    volumes:
      - ./config:/etc/caddy:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge-jainav
      - edge-jainav-staging
      - edge-menumesh
      - edge-menumesh-staging
    # The Caddyfile pins the admin API to 127.0.0.1:2019, inside this container: nothing publishes
    # it. The check uses that address, because busybox's wget resolves localhost to ::1. The answer
    # holds the loaded config, secrets included, so it is thrown away.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Every app's edge networks, the ones listed in /etc/apps/edge.conf. app-apply creates a missing
  # one as an internal network (docker network create --internal <name>) and refuses one that is
  # not internal. Each holds only Caddy and that app's own services.
  edge-jainav:
    external: true
  edge-jainav-staging:
    external: true
  edge-menumesh:
    external: true
  edge-menumesh-staging:
    external: true

volumes:
  caddy_data:
  caddy_config:
