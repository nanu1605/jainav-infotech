# Installed to /etc/systemd/journald.conf.d/zz-retention.conf. A line stays 180 to 187 days, which
# the privacy policies state; the name must sort after Ubuntu's own syslog.conf, or its
# ForwardToSyslog=yes wins (docs/decisions.md, docs/runbooks/monitoring.md).
# 24G holds about 85,000 filtered lines a day for the whole period, shared by every app. Before
# 2027-05-13 raise MaxRetentionSec to 372day and republish the policies.
[Journal]
Storage=persistent
MaxRetentionSec=187day
MaxFileSec=7day
SystemMaxUse=24G
# Docker's fields fill a file at about 44,000 lines, so the default 100 files would cap the
# journal far below 24G.
SystemMaxFiles=1000
ForwardToSyslog=no
