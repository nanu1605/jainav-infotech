# /etc/apps/edge.conf (root:root 0644): the edge project, Caddy (docker/edge). The admin changes
# it with app-apply edge and runs it with app-compose edge; app-deploy deploys nothing here.
PROJECT_DIR=/srv/edge
APP_COMPOSE_FILE=compose.yml
# None: edge.env is Caddy's env_file, read by the container, not by compose for interpolation.
ENV_FILES=
# The pinned image for adapt and validate runs (app-apply); the same one compose.yml runs.
CADDY_IMAGE=caddy:2.11.7-alpine
env_config() { return 1; }
# Every app's edge networks, so the edge project can join a new app's networks before that app's
# own conf exists. app-apply creates a missing one with docker network create --internal and
# refuses one that exists but is not internal.
EDGE_NETWORKS="edge-jainav edge-jainav-staging edge-menumesh edge-menumesh-staging"
# Journal lines a day that hostwatch allows this project's containers (the log-rate check).
LOG_LINE_BUDGET=10000
# No settings archive: after a server loss the edge is rebuilt from the password manager
# (edge.env), new Origin CA certificates and each app's own repository (its site and log-redact
# files): docs/runbooks/backups.md, "Disaster recovery on a new server".
