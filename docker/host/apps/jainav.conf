# /etc/apps/jainav.conf (root:root 0644): Jainav on the shared server, sourced by root's host
# scripts (app-deploy, app-compose, app-apply, app-config-archive, hostwatch). install.sh installs
# it once and never overwrites it: fill BACKUP_RECIPIENT and ZONE on the server. The other
# variables are explained in app.conf.example.
PROJECT_DIR=/srv/jainav
APP_COMPOSE_FILE=compose.prod.yml            # not COMPOSE_FILE, which Compose itself reads
ENV_FILES=".env images.env"
CI_USER=deploy-jainav
CI_ENVS="staging production"
REPO=ghcr.io/nanu1605/jainav-infotech
REGISTRY_USER=nanu1605                       # GHCR may ignore the name with a token; verify once
env_config() {
  case $1 in
    staging)    SERVICE=app-staging VAR=STAGING_IMAGE TAG='staging-[0-9a-f]{40}' ;;
    production) SERVICE=app         VAR=APP_IMAGE     TAG='prod-v[0-9]+\.[0-9]+\.[0-9]+' ;;
    backup)     SERVICE=backup      VAR=BACKUP_IMAGE  TAG='backup-[0-9a-f]{40}' ;;   # admin only
    *) return 1 ;;
  esac
}
EXTRA_TAG='tools-[0-9a-f]{40}' EXTRA_MODE=pull EXTRA_KEEP=3
HEALTH_TIMEOUT=300
PREDEPLOY_DB="postgres postgres jainav"      # service, user, databases: dumped before production switches
BACKUP_RECIPIENT=                            # the age public key, filled on the server
CONFIG_ARCHIVE_FILES=".env images.env production.env staging.env deploys.log"
ZONE={{DOMAIN}}
UPSTREAMS="jainav-app:3000 jainav-app-staging:3000 jainav-umami:3000"
ENV_PREFIX=JAINAV_
EDGE_NETWORKS="edge-jainav edge-jainav-staging"
