# Installed to /etc/sysctl.d/90-server.conf (docs/runbooks/server.md §2).
# The 4 GiB swap file is for bursts: keep page cache and database memory ahead of idle heap.
vm.swappiness=10

# Nothing else here on purpose. The firewall needs no sysctl: route_localnet, which Docker sets
# per bridge when userland-proxy is off, can't be forced down from here (the kernel ORs the "all"
# and per-interface values), so cf-ranges guards 127.0.0.0/8 in INPUT instead.
# Fallback if IPv6 misbehaves on the public interface only, so ::1 stays for sshd (replace eth0):
# net.ipv6.conf.eth0.disable_ipv6=1
