# The kit's limits and metrics for the tunnel connector (docs/runbooks/cloudflare.md). It has its
# own name: `systemctl edit cloudflared` writes override.conf, so an edit made during an incident
# never lands in this file. "cloudflared service install <token>" writes the unit itself: its
# ExecStart already passes --no-autoupdate, and the token goes to /etc/cloudflared/token with
# --token-file. This drop-in leaves ExecStart alone, so it needs neither the binary's path nor the
# token (a new ExecStart= here would have to repeat both).
# The options arrive as the environment variables cloudflared reads for the same flags.
[Service]
MemoryMax=256M
OOMScoreAdjust=-900
# --metrics: loopback only. hostwatch reads cloudflared_tunnel_ha_connections here.
Environment=TUNNEL_METRICS=127.0.0.1:20241
# --no-autoupdate: the version changes on purpose (the one pinned in CI), never by itself.
Environment=NO_AUTOUPDATE=true
