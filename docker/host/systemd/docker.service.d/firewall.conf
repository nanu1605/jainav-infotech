# Docker starts only with the Cloudflare-only filters in place (docs/runbooks/server.md).
# Wants=, not Requires=: Requires= would also stop or restart Docker whenever the firewall unit is
# stopped or restarted. If verify fails (a malformed range list, a flushed chain), Docker stays down.
[Unit]
Wants=cf-ranges-firewall.service
After=cf-ranges-firewall.service

[Service]
ExecStartPre=/usr/local/sbin/cf-ranges verify
