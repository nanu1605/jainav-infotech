# Installed last, by install.sh --harden, to /etc/ssh/sshd_config.d/00-hardening.conf. It sorts
# before the provider's 50-cloud-init.conf: sshd uses the first value it reads for each option.
# After this, sshd listens on loopback only and is reached through the Cloudflare tunnel
# (docs/runbooks/server.md). Root and passwords are gone; the way back in is the web console.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers ops deploy-jainav deploy-menumesh
ListenAddress 127.0.0.1
ListenAddress ::1
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
