# Installed to /etc/ssh/sshd_config.d/10-users.conf by install.sh, together with the users.
# Deploy keys live in root-owned files, so a deploy user can't add one (docs/runbooks/server.md §2).
Match User deploy-*
  AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
  PermitTTY no
Match User ops
  AllowTcpForwarding local
# Ends the blocks above. OpenSSH restores the Match state after each included file, so an open
# block can't leak into the next file; this is hygiene. Check with: sshd -T -C user=ops,host=h,addr=127.0.0.1
Match all
