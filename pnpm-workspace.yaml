allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
# Lazy server children crash Slot 1.3.3 in client components (docs/decisions.md). Drop this once
# radix-ui ships react-slot >= 1.5.0 past the cool-off.
overrides:
  '@radix-ui/react-slot': 1.5.0
  # Payload 3.90.2 pins 7.29.0, which has two high advisories (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3).
  undici: 7.29.1

# braces (via sass, chokidar) has an advisory with no fixed release; Sass only compiles the admin's
# styles at build time, never on visitor input. Drop this once a fix ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
