allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
overrides:
  # Clears the audit for monaco-editor's unused dependency, 3.4.15 (GHSA-cg2g-xh64-v4q7, critical,
  # and GHSA-mrv2-3pqr-j5jr). The admin's Monaco comes from jsDelivr (docs/decisions.md).
  dompurify: 3.4.17
  # Clears GHSA-834v-8h66-3h79 and GHSA-c8p4-j97h-3vg8. An exception to the two-week rule, and
  # outside @lexical/headless's ^20.9.0, but nothing here loads the `./dom` entry that imports it
  # (docs/decisions.md). Drop this once Payload moves to Lexical 0.53 or later, which needs ^21.0.4.
  happy-dom: 21.0.4

# braces (via sass, chokidar) has an advisory with no fixed release; Sass only compiles the admin's
# styles at build time, never on visitor input. Drop this once a fix ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
