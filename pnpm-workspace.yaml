allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
# Lazy server children crash Slot 1.3.3 in client components (docs/decisions.md). Drop this once
# radix-ui ships react-slot >= 1.5.0 past the cool-off.
overrides:
  '@radix-ui/react-slot': 1.5.0
  # Payload 3.90.2 pins 7.29.0; 7.30.1 is the first release clear of the high advisories
  # (GHSA-xjj6-f33q-929c, GHSA-2m5v-pch6-74hx, GHSA-4w7w-5xrc-9h26, GHSA-qrxm-fqhp-jwvm).
  undici: 7.30.1
  # Clears the audit for monaco-editor's unused dependency, 3.4.15 (GHSA-cg2g-xh64-v4q7, critical,
  # and GHSA-mrv2-3pqr-j5jr). The admin's Monaco comes from jsDelivr (docs/decisions.md).
  dompurify: 3.4.17
  # Removes happy-dom 20.14.6 (GHSA-834v-8h66-3h79, GHSA-c8p4-j97h-3vg8). Among production
  # dependencies only @lexical/headless's `./dom` entry imports it, and nothing here loads that
  # entry (docs/decisions.md). Drop this once Payload moves to Lexical 0.53 or later, whose
  # @lexical/headless declares a fixed happy-dom.
  '@lexical/headless>happy-dom': '-'

# braces (via sass, chokidar) has an advisory with no fixed release; Sass only compiles the admin's
# styles at build time, never on visitor input. Drop this once a fix ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
