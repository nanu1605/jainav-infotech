name: Deploy

# spec §18.3: a merge to main deploys staging; a release tag (v1.2.3) deploys production after
# the "production" environment's required reviewer approves. Each environment gets its own image
# because NEXT_PUBLIC_* values are baked in at build time: never promote staging to production.
# Setup (secrets, variables, the VPS): docs/runbooks/deploy.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Off until the VPS exists: set the repository variable DEPLOY_ENABLED to "true".
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    env:
      SERVICE: ${{ startsWith(github.ref, 'refs/tags/') && 'app' || 'app-staging' }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ startsWith(github.ref, 'refs/tags/') && format('prod-{0}', github.ref_name) || format('staging-{0}', github.sha) }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICE }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CDN_URL=${{ vars.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      # Full source and dependencies for one-off commands on the server (seed, migrate, release
      # import); see docs/runbooks/server.md.
      - name: Build and push the tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: tools
          push: true
          tags: ghcr.io/${{ github.repository }}:tools-${{ github.sha }}
          cache-from: type=gha,scope=${{ env.SERVICE }}

      - name: Deploy on the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The job's token lets the VPS pull this image; it expires when the job ends.
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "$TARGET" "/srv/jainav/deploy.sh $SERVICE $IMAGE"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests
        run: pnpm test:smoke
        env:
          SMOKE_BASE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Staging only: basic auth in front of the site ("user:password").
          SMOKE_BASIC_AUTH: ${{ secrets.SMOKE_BASIC_AUTH }}
          # "1" once Cloudflare Access protects /admin in this environment.
          SMOKE_ADMIN_ACCESS: ${{ vars.SMOKE_ADMIN_ACCESS }}
