name: Backup image

# The backup job's image (docker/backup) is built here and never on the server. A push to main that
# touches docker/backup, or a manual run, pushes backup-<commit> to the repository's package and
# prints tag@digest in the job summary. The admin installs it on the server with
# `sudo app-deploy jainav backup <tag>@<digest>` (docs/runbooks/server.md).

on:
  push:
    branches: [main]
    paths: ['docker/backup/**']
  workflow_dispatch:

concurrency:
  group: backup-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the image
        id: names
        run: |
          # The server's deploy script accepts exactly backup-<40 hex>.
          tag="backup-$GITHUB_SHA"
          [[ "$tag" =~ ^backup-[0-9a-f]{40}$ ]] || { echo "unexpected tag: $tag"; exit 1; }
          { echo "tag=$tag"; echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$tag"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/backup
          push: true
          tags: ${{ steps.names.outputs.image }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Print the reference to install
        env:
          TAG: ${{ steps.names.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Backup image'
            echo
            echo 'Install it with the admin form: sudo app-deploy jainav backup <reference>'
            echo
            echo '```'
            echo "$TAG@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
