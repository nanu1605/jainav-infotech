name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19; upgrade deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jainav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jainav_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jainav_test
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # spec §16. Ignored advisories (no fix released) are listed in pnpm-workspace.yaml.
      - name: No high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations match the Payload config
        run: pnpm check:migrations
      - run: pnpm check:tokens
      - run: pnpm check:i18n
      - name: Generated tokens match brand.config.ts
        run: |
          pnpm tokens:build
          git diff --exit-code -- src/styles/tokens.css src/styles/tokens.generated.ts
      - name: Build without a database
        run: pnpm build
        env:
          SKIP_DB_AT_BUILD: '1'

  # The production image builds (no push): catches Dockerfile and standalone-output breakage
  # before a deploy does.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
