# spec §16: dependency updates. The cooldown keeps the project's two-week supply-chain rule
# (docs/decisions.md): no update is proposed until its release is 14 days old. Security updates
# (enable them in the repository settings) are not delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 5
    # @types/node stays on the Node major the app runs: NODE_IMAGE in docker/Dockerfile.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      payload:
        patterns: ['payload', '@payloadcms/*']
      next:
        patterns: ['next', 'react', 'react-dom', '@next/*']
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }

  # FROM lines only: Dependabot skips docker/Dockerfile's # syntax= line, moved by hand
  # (docs/decisions.md).
  - package-ecosystem: docker
    directories: [/docker, /docker/backup]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    # Postgres stays on 17 (docs/decisions.md): a new major can't open the old data directory.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  # For an image pinned as tag@sha256:digest, a pull request changes both (a rebuilt tag comes as a
  # new digest alone), and each is a server change (docs/runbooks/server.md §7). The edge's Caddy
  # image is also CADDY_IMAGE in docker/host/apps/edge.conf, which Dependabot can't edit: the bump's
  # pull request gets that line by hand, and CI (host-scripts) fails until the two match
  # (docs/runbooks/edge.md §5).
  - package-ecosystem: docker-compose
    directories: [/docker, /docker/edge]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    # Postgres stays on 17 (docs/decisions.md): a new major can't open the old data directory.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
